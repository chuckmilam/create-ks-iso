name: Shellcheck and Container-Based CI Tests
on: 
    push:
        paths-ignore:
            - 'README.md'
jobs:
    shellcheck:
      name: Shellcheck
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v3
        - name: Run ShellCheck
          uses: ludeeus/action-shellcheck@master
          with:
            severity: error
    test-build-run-create-ks-iso:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v3
        - name: Build and smoke-test the container image
          run: CONTAINER_ENGINE=docker ./test-container-build.sh

